name: Test

# ci.yml と release.yml から workflow_call で共有されるテストジョブ
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ffmpeg/ffprobe に依存する統合テストは Linux でのみ実行する
      # (他 OS ではテスト側の Skip 処理で除外される)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: go test -race ./...
